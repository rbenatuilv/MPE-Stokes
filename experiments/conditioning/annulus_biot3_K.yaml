# Condition number of the biot3 step matrix against the permeability K, on the mesh of the
# experiment (h = 0.5 mm, dt = 10 ms), two decades on each side of the brain value 1.57e-11 m^2.
# Low permeability is the classic regime where Biot discretizations lose robustness.
# Prediction for biot3 (theory section 10): Jacobi-scaled cond ~ sqrt(K) (the w-p coupling after
# diagonal scaling), Schur-scaled cond roughly independent of K.
#
#   python -m biotx.conditioning experiments/conditioning/annulus_biot3_K.yaml

base: ../annulus_biot3.yaml

conditioning:
  sweep: {material.K: [1.57e-9, 1.57e-10, 1.57e-11, 1.57e-12, 1.57e-13]}
  scaling: [raw, jacobi, schur]

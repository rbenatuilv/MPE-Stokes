name: biotx
channels:
  - conda-forge
  - nodefaults            # never mix in the anaconda defaults channel
dependencies:
  - python=3.12
  - fenics-dolfinx=0.11.0 # brings its own C compiler (gcc) for the form JIT
  - petsc=*=real*         # real (not complex) PETSc build
  - mpich                 # one MPI implementation, chosen explicitly
  - setuptools            # build backend of biotx (pip install -e .)
  - python-gmsh           # mesh generation / import
  - pyyaml                # config files
  - numpy
  - matplotlib
  - pytest
  - pip                   # then, from the repo root: pip install -e . --no-deps --no-build-isolation

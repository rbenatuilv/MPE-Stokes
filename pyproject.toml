[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "biotx"
version = "0.1.0"
description = "Two- and three-field Biot experiments in DG FEniCSx, driven by YAML files"
requires-python = ">=3.11"
dependencies = []          # deliberately empty: conda provides dolfinx, gmsh, pyyaml

[tool.setuptools]
packages = ["biotx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: convergence studies on several meshes"]
# the test fixtures share one material between biot2 and biot3 (test_config checks the warning)
filterwarnings = ["ignore:material.*not used by:UserWarning"]

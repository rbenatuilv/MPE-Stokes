# Two-field Biot (d, p) on a spherical shell with an off-centre hole: the 3D version of
# ../brain_annulus/annulus_biot2.yaml. A fluid-filled cavity (radius 2.5 mm, centred at x = 3 mm) inside a poroelastic
# ball (radius 1 cm): the tissue is thick on the left (10.5 mm) and thin on the right (4.5 mm).
# The cavity pressure pc(t) pulses once per second; the outer wall is fixed and drained.
#
# A coarse mesh (h = 2 mm, P1) to see how the solver behaves in 3D on this machine (5 GB, MUMPS LU).
#
#   python -m biotx.run applications/shell_3d/shell_biot2.yaml   # -> shell_3d/results/shell_biot2*.npz, shell_biot2/*.bp
#
# Everything is in SI. The scales only set the non-dimensional problem that is solved.

model: biot2

scales: {L0: 1.0e-2, T0: 1.0, P0: 1500.0}           # m, s, Pa

material:                                            # brain tissue
  mu: 1500.0          # Pa
  lambda: 11567.0     # Pa
  alpha: 0.49
  c0: 1.0e-6          # 1/Pa
  K: 1.57e-11         # m^2
  muF: 3.5e-3         # Pa s
  rho: 1000.0         # kg/m^3

geometry:
  shape: shell
  radius: 1.0e-2                                     # outer sphere, centred at the origin
  inner: {center: [3.0e-3, 0.0, 0.0], radius: 2.5e-3}  # off-centre: thick side left, thin side right
  h: 2.0e-3                                          # coarse: about 2 cells across the thin side
  names: {inner: cavity, outer: wall}

params:
  A: 133.3            # Pa = 1 mmHg, pulse amplitude
  f: 1.0              # Hz

loads:
  pc: "A * (1 - cos(2*pi*f*t)) / 2"                  # starts from rest, peak A at t = 0.5 s

boundaries:
  cavity: {pressure: pc, normal_traction: -pc}       # cavity fluid pushes on fluid and solid
  wall:   {pressure: 0,  displacement: [0, 0, 0]}    # drained, fixed

discretization: {deg: 1, eta: 50}                     # P1/P1 (P2 needs more than 5 GB in 3D). eta = 10
                                                     # is unstable on these tets (blows up from step 1)

time: {T: 3.0, dt: 0.01, theta: 0.5}                 # Crank-Nicolson for the pressure

output:
  dir: results
  series: [p, cflux]                                 # also what ParaView writes (with d)
  fields: [p, cflux]                                 # full fields at the snapshots
  snapshots: {from: 2.0, to: 3.0, every: 5}          # the last period, every 0.05 s
  probes:
    thick: [-5.0e-3, 0.0, 0.0]                       # middle of the thick side
    thin:  [7.75e-3, 0.0, 0.0]                       # middle of the thin side
  lines:
    x_axis: {from: [-1.0e-2, 0.0, 0.0], to: [1.0e-2, 0.0, 0.0], n: 201}
  slices:
    z0: {normal: z, at: 0.0, n: 81}                  # the plane through both centres
  paraview: 5                                        # every 0.05 s, to results/<name>/*.bp
